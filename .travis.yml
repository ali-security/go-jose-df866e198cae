language: go

matrix:
  fast_finish: true

go:
  - "1.23.x"
  - "1.24.x"

before_script:
  - export PATH=$HOME/.local/bin:$PATH

before_install:
  - pip install cram --user

script:
  - go test -v -covermode=count -coverprofile=profile.cov . 2>&1 | tee -a $HOME/gotest.log; test ${PIPESTATUS[0]} -eq 0
  - go test -v -covermode=count -coverprofile=cryptosigner/profile.cov ./cryptosigner 2>&1 | tee -a $HOME/gotest.log; test ${PIPESTATUS[0]} -eq 0
  - go test -v -covermode=count -coverprofile=cipher/profile.cov ./cipher 2>&1 | tee -a $HOME/gotest.log; test ${PIPESTATUS[0]} -eq 0
  - go test -v -covermode=count -coverprofile=jwt/profile.cov ./jwt 2>&1 | tee -a $HOME/gotest.log; test ${PIPESTATUS[0]} -eq 0
  - go test -v ./json 2>&1 | tee -a $HOME/gotest.log; test ${PIPESTATUS[0]} -eq 0  # no coverage for forked encoding/json package
  - |
    awk '/^--- PASS/{p++} /^--- FAIL/{f++} /^--- SKIP/{s++} END{printf "GO TEST SUMMARY: passed=%d failed=%d skipped=%d\n", p, f, s}' $HOME/gotest.log
  - cd jose-util && go build -mod=mod && PATH=$PWD:$PATH cram -v jose-util.t # cram tests jose-util
  - cd ..
